[package]
name = "socialposter-example-plugin"
version = "1.0.0"
edition = "2021"
description = "Reference SocialPoster WebAssembly plugin written in Rust using extism-pdk."

[lib]
# Compile as a C-compatible dynamic library so Cargo produces a standalone .wasm module.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
