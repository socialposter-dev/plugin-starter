name: Build & Verify SocialPoster WASM Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-rust:
    name: Build & Verify (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Compile Rust plugin
        working-directory: rust
        run: |
          cargo build --release --target wasm32-wasip1
          cp target/wasm32-wasip1/release/socialposter_example_plugin.wasm ../output/example-social-rust.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports
        run: node cli/verify-wasm.mjs output/example-social-rust.wasm

  build-go:
    name: Build & Verify (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install TinyGo
        run: |
          curl -fsSL https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb -o /tmp/tinygo.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Compile Go plugin
        working-directory: go
        run: |
          go mod tidy
          tinygo build -o ../output/example-social-go.wasm -target wasip1 -buildmode=c-shared .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports
        run: node cli/verify-wasm.mjs output/example-social-go.wasm

  build-typescript:
    name: Build & Verify (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Binaryen and extism-js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          gh release download --repo extism/js-pdk --pattern "extism-js-x86_64-linux-*.gz" --dir /tmp
          gunzip -f /tmp/extism-js-x86_64-linux-*.gz
          sudo mv /tmp/extism-js-x86_64-linux-* /usr/local/bin/extism-js
          sudo chmod +x /usr/local/bin/extism-js
          extism-js --version || extism-js --help

      - name: Compile TypeScript plugin
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Verify WebAssembly ABI exports
        run: node cli/verify-wasm.mjs output/example-social-typescript.wasm

  build-python:
    name: Build & Verify (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install binaryen and extism-py
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binaryen jq
          ASSET_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/extism/python-pdk/releases/latest | jq -r '.assets[] | select(.name | test("linux") and test("x86_64|amd64")) | .browser_download_url' | head -n 1)
          curl -fsSL "$ASSET_URL" -o /tmp/extism-py-asset
          mkdir -p /tmp/extism-py
          tar -xzf /tmp/extism-py-asset -C /tmp/extism-py
          BIN_PATH=$(find /tmp/extism-py -type f -name "extism-py" | head -n 1)
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/extism-py
          USR_DIR=$(find /tmp/extism-py -maxdepth 4 -type d -name "usr" | head -n 1)
          mkdir -p "${HOME}/.local/share/extism-py"
          cp -r "$USR_DIR" "${HOME}/.local/share/extism-py/usr"
          test -d "${HOME}/.local/share/extism-py/usr"

      - name: Compile Python plugin
        working-directory: python
        run: extism-py plugin.py -o ../output/example-social-python.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports
        run: node cli/verify-wasm.mjs output/example-social-python.wasm

  build-c:
    name: Build & Verify (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WASI SDK
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz -o /tmp/wasi-sdk.tar.gz
          tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp

      - name: Compile C plugin
        working-directory: c
        run: make CC=/tmp/wasi-sdk-25.0-x86_64-linux/bin/clang OUT=../output/example-social-c.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports
        run: node cli/verify-wasm.mjs output/example-social-c.wasm
