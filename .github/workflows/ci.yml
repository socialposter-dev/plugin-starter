name: Build & Verify SocialPoster WASM Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-rust:
    name: Build & Verify (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Compile Rust plugin
        working-directory: rust
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/socialposter_example_plugin.wasm ../output/example-social-rust.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports and size limit
        run: node cli/verify-wasm.mjs output/example-social-rust.wasm

  build-go:
    name: Build & Verify (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install TinyGo
        run: |
          curl -fsSL https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb -o /tmp/tinygo.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Compile Go plugin
        working-directory: go
        run: |
          go mod tidy
          GOFLAGS="-buildvcs=false" tinygo build -o ../output/example-social-go.wasm -target wasip1 -buildmode=c-shared .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports and size limit
        run: node cli/verify-wasm.mjs output/example-social-go.wasm

  build-assemblyscript:
    name: Build & Verify (AssemblyScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile AssemblyScript plugin
        working-directory: assemblyscript
        run: |
          npm ci
          npm run build

      - name: Verify WebAssembly ABI exports and size limit
        run: node cli/verify-wasm.mjs output/example-social-assemblyscript.wasm

  build-zig:
    name: Build & Verify (Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.13.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Compile Zig plugin
        working-directory: zig
        run: |
          zig fetch --save=extism_pdk https://github.com/extism/zig-pdk/archive/refs/tags/v1.2.1.tar.gz
          zig build -Doptimize=ReleaseSmall

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports and size limit
        run: node cli/verify-wasm.mjs output/example-social-zig.wasm

  build-c:
    name: Build & Verify (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WASI SDK
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz -o /tmp/wasi-sdk.tar.gz
          tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp

      - name: Compile C plugin
        working-directory: c
        run: make CC=/tmp/wasi-sdk-25.0-x86_64-linux/bin/clang OUT=../output/example-social-c.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify WebAssembly ABI exports and size limit
        run: node cli/verify-wasm.mjs output/example-social-c.wasm
